aid: blackpoint
name: Blackpoint
description: >-
  Blackpoint Cyber is an Accel-backed cybersecurity company whose CompassOne
  platform unifies prevention, detection, and response into a single security
  operations product for MSPs, MSSPs, and enterprises. CompassOne combines
  managed detection and response (MDR), identity threat detection and response
  (ITDR), and security posture management, backed by a 24/7 human-led,
  AI-powered security operations center of threat hunters and incident
  responders. Capabilities span asset discovery and inventory, endpoint and
  cloud threat detection, cloud posture and configuration-drift management,
  vulnerability prioritization, application control, SIEM, and compliance and
  security-maturity assessment. The CompassOne product API
  (api.blackpointcyber.com) is gated behind an Auth0 OIDC identity tenant and
  portal-issued API keys; this API Evangelist profile captures Blackpoint's
  public identity, security, compliance, and developer surface.
